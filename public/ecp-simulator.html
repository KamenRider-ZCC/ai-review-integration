<!doctype html>
<!-- 仅用于公司内模拟宿主调用；该页面和其中的演示Token不得部署到客户生产环境。 -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>宿主模拟页</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: #f4f6f8; color: #263238; font-family: "Microsoft YaHei", sans-serif; }
      header { display: flex; height: 56px; align-items: center; justify-content: space-between; padding: 0 24px; background: #243746; color: #fff; }
      main { padding: 28px; }
      .card { max-width: 960px; margin: 0 auto; border: 1px solid #e3e8ed; background: #fff; padding: 24px; box-shadow: 0 4px 18px rgb(20 40 60 / 7%); }
      h1 { margin: 0; font-size: 18px; }
      h2 { margin: 0 0 8px; font-size: 17px; }
      p { margin: 0 0 20px; color: #687680; line-height: 1.7; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
      button { min-height: 40px; border: 1px solid #cfd8df; background: #fff; color: #344450; cursor: pointer; }
      button:hover { border-color: #1677ff; color: #1677ff; }
      .notice { margin-top: 20px; border-left: 3px solid #1677ff; background: #f0f7ff; padding: 12px; color: #526371; }
    </style>
  </head>
  <body>
    <header><h1>宿主模拟页</h1><span>仅用于公司内联调</span></header>
    <main>
      <section class="card">
        <h2>AI评标入口</h2>
        <p>本页只向Loader传正式入口参数。AI结果、专家结果、Token、导航和文件内容均不通过postMessage传递。</p>
        <div class="grid">
          <button data-scene="progress">打开AI评审进度</button>
          <button data-scene="formal-ai">形式评审 AI</button>
          <button data-scene="detail-feedback">详细评审反馈</button>
          <button data-scene="all-feedback">全部专家不一致项</button>
        </div>
        <div class="notice" id="notice">等待操作</div>
      </section>
    </main>
    <script src="/ai-review-loader.js"></script>
    <script>
      // 本地演示Cookie仅用于在切换到HTTP请求时模拟客户平台登录态。
      document.cookie = 'Access-Token=LOCAL-DEMO-TOKEN; path=/; SameSite=Lax';
      var notice = document.getElementById('notice');
      window.AIReview.init({
        appBaseUrl: window.location.origin + '/ai-review/',
        destroyOnClose: true,
        onOpened: function (payload) { notice.textContent = '已打开：' + JSON.stringify(payload); },
        onClosed: function () { notice.textContent = 'AI页面已关闭'; },
        onError: function (payload) { notice.textContent = 'AI页面提示：' + (payload && payload.message || '未知错误'); }
      });

      document.addEventListener('click', function (event) {
        var button = event.target.closest('[data-scene]');
        if (!button) return;
        var scene = button.getAttribute('data-scene');
        if (scene === 'progress') {
          window.AIReview.open({ page: 'progress', reviewId: 'TEST-REV-0001' });
        } else if (scene === 'formal-ai') {
          window.AIReview.open({
            page: 'page', reviewId: 'TEST-REV-0001', action: 'AI',
            reviewStage: 'FORMAL_REVIEW', reviewItemId: 'FR001', bidderId: 'BIDDER001'
          });
        } else if (scene === 'detail-feedback') {
          window.AIReview.open({
            page: 'page', reviewId: 'TEST-REV-0001', action: 'AI_FEEDBACK',
            reviewStage: 'DETAILED_REVIEW', reviewItemId: 'DR001', bidderId: 'BIDDER001'
          });
        } else {
          window.AIReview.open({ page: 'page', reviewId: 'TEST-REV-0001', action: 'AI_FEEDBACK' });
        }
      });
    </script>
  </body>
</html>
